{% extends "base.html" %}
{% block title %}Sign in - FerrisCTF{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">ID</label>
    <input id="username" name="username" required maxlength="64" autocomplete="username" spellcheck="false" autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required maxlength="128" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
