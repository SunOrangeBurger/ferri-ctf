<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nimbus 2000{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="/" aria-label="Nimbus 2000">
      <span class="brand-name">Nimbus 2000</span>
    </a>
    <nav class="nav-links">
      <a href="/scoreboard">Leaderboard</a>
      {% if user %}
        <a href="/challenges">Challenges</a>
        <a href="/team">Team</a>
        <a href="/profile">Profile</a>
        {% if user.is_admin %}
          <a href="/admin/dashboard" class="admin-link">Admin</a>
        {% endif %}
        <span class="user-badge">{{ user.display_name }}</span>
        <form method="post" action="/logout" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit" class="link">Log out</button>
        </form>
      {% else %}
        <a href="/login">Log in</a>
        <a href="/register" class="btn nav-register">Register</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="footer-name">Nimbus 2000</span>
      </div>
      <div class="footer-info">
        <span>Capture The Flag Platform</span>
      </div>
    </div>
  </footer>
</body>
</html>
