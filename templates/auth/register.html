{% extends "base.html" %}
{% block title %}Register - FerrisCTF{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create an account</h1>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">College ID</label>
    <input id="username" name="username" value="{{ username }}" required maxlength="32" autocomplete="username" spellcheck="false" autofocus>
    <label for="display_name">Display name</label>
    <input id="display_name" name="display_name" value="{{ display_name }}" required maxlength="40" autocomplete="name">
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password">
    <label for="password_confirm">Confirm password</label>
    <input id="password_confirm" type="password" name="password_confirm" required minlength="8" maxlength="128" autocomplete="new-password">
    <p class="hint">Use 8 to 128 characters for your password.</p>
    <button type="submit">Register</button>
  </form>
  <p class="hint">Already registered? <a href="/login">Log in</a>.</p>
</section>
{% endblock %}
