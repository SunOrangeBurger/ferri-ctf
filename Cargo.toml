[package]
name = "ferrisctf"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
# Web and async runtime
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "compression-gzip", "set-header", "limit"] }
tower_governor = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"          # axum 0.7 custom extractors still need it

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }

# Templates and embedded assets
minijinja = { version = "2.0", features = ["loader", "json"] }
rust-embed = "8"             # embeds templates/ and static/ into the binary
mime_guess = "2"             # Content-Type for embedded /static/* files

# Cryptography and security
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.5"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1.8", features = ["v4", "serde"] }
zeroize = "1.7"

# Serialization and utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
thiserror = "1.0"
anyhow = "1.0"
num_cpus = "1.16"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Deliberately NOT panic = "abort": one handler panic should not kill the whole event.
# Dependencies (argon2 especially) are unusably slow unoptimized; our own code stays debuggable.
[profile.dev.package."*"]
opt-level = 3
